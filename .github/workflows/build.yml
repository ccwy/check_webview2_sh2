name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      has_version: ${{ steps.version.outputs.has_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract version
        id: version
        shell: bash
        run: |
          HAS_VERSION=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            HAS_VERSION=true
          else
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            TAG_NAME=$(echo "$COMMIT_MSG" | grep -oiE 'v[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || true)
            if [ -n "$TAG_NAME" ]; then
              HAS_VERSION=true
            fi
          fi
          if [ "$HAS_VERSION" = true ]; then
            VERSION="${TAG_NAME#v}"
            echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "has_version=true" >> $GITHUB_OUTPUT
            echo "Detected version: $TAG_NAME"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
            echo "tag=" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "has_version=false" >> $GITHUB_OUTPUT
            echo "No version detected, skip release. Build version: $VERSION"
          fi

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Build
        shell: cmd
        run: |
          rc resource.rc
          cl check_env.c resource.res /MT /O2 /Fe:check_env.exe advapi32.lib version.lib shell32.lib comctl32.lib user32.lib gdi32.lib

      - name: Rename with version
        shell: bash
        run: mv check_env.exe check_env_v${{ steps.version.outputs.version }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: check_env
          path: check_env_*.exe
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: needs.build.outputs.has_version == 'true'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: check_env
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          files: ./release/check_env_*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}