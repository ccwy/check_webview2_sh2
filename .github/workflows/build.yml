name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0)'
        required: true

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.get_version.outputs.should_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=""
          SHOULD_RELEASE="false"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${{ github.ref_name }}"
            SHOULD_RELEASE="true"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            SHOULD_RELEASE="true"
          else
            TAG=$(git tag --points-at HEAD --list 'v*' | head -1)
            if [[ -n "$TAG" ]]; then
              VERSION="$TAG"
              SHOULD_RELEASE="true"
            else
              VERSION="dev-$(git rev-parse --short HEAD)"
              SHOULD_RELEASE="false"
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "should_release=$SHOULD_RELEASE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION, Release: $SHOULD_RELEASE"

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1.13.0

      - name: Build
        shell: cmd
        run: |
          rc resource.rc
          cl check_env.c resource.res /MT /O2 /Fe:check_env.exe advapi32.lib version.lib shell32.lib comctl32.lib user32.lib gdi32.lib

      - name: Rename with version
        shell: bash
        run: mv check_env.exe check_env_${{ steps.get_version.outputs.version }}.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: check_env
          path: check_env_*.exe
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-24.04
    if: needs.build.outputs.should_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: check_env
          path: ./release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          files: ./release/check_env_*.exe
          generate_release_notes: true
          draft: false
          prerelease: false