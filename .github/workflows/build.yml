name: Build and Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Build with GCC (static linking)
        shell: msys2 {0}
        run: |
          windres resource.rc -o resource.o
          gcc check_env.c resource.o -o check_env.exe -Wall -O2 -static -mwindows -ladvapi32 -lversion -lshell32 -lcomctl32
          echo "Build successful"

      - name: Verify exe
        shell: msys2 {0}
        run: |
          file check_env.exe
          objdump -p check_env.exe | grep "DLL Name" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: check_env
          path: check_env.exe
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: check_env
          path: ./release

      - name: List release files
        run: ls -la ./release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release/check_env.exe
          generate_release_notes: true
          draft: false
          prerelease: false